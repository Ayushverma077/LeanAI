[workspace]
resolver = "2"
members = ["crates/leanai-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["LeanAI Desktop contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
ignore = "0.4"
globset = "0.4"
regex = "1"
tiktoken-rs = "0.7"
once_cell = "1"

# The tokenizer dominates bundle-build time, and an unoptimised `cl100k_base`
# encode is ~40x slower than an optimised one — which is why `tauri dev` felt
# so much slower than a packaged build. Compiling *dependencies* with
# optimisations keeps our own crates fully debuggable while removing that cliff.
[profile.dev.package."*"]
opt-level = 3

# Our own crates stay at opt-level 0 for fast incremental rebuilds, but a
# little optimisation in the hot tokenizer path costs almost no build time.
[profile.dev.package.leanai-core]
opt-level = 2
